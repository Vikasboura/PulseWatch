services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsewatch
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_secret
    ports:
      - "5432:5432"
    volumes:
      - pulsewatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsewatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql://pulsewatch:pulsewatch_secret@postgres:5432/pulsewatch
      SECRET_KEY: pulsewatch-prod-jwt-secret-key-replace-in-cloud-deployment-991283
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      RATE_LIMIT_PER_MINUTE: 1200
      MAX_INGEST_BATCH_SIZE: 500
      MAX_LOG_MESSAGE_LENGTH: 10000
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsewatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pulsewatch_pgdata:
    driver: local
