services:
  # PulseWatch Backend Web Service
  - type: web
    name: pulsewatch-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: standard # Keep process alive continuously for alert worker
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pulsewatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "1200"
      - key: CORS_ORIGINS
        value: '["https://pulsewatch-app.onrender.com","http://localhost:3000"]'

  # PulseWatch Frontend Dashboard
  - type: web
    name: pulsewatch-app
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        value: https://pulsewatch-api.onrender.com

databases:
  - name: pulsewatch-db
    databaseName: pulsewatch
    user: pulsewatch
    plan: free
    region: oregon
