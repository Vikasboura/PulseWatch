name: PulseWatch CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../sdk

      - name: Run Test Suite
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-pulsewatch-12345
        run: |
          pytest -v --tb=short tests/

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Build
        run: npm run build

  build-containers:
    name: Docker Build Validation
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: pulsewatch/backend:latest

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: pulsewatch/frontend:latest

  deploy:
    name: Auto Deploy to Production
    needs: [build-containers]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Trigger
        run: |
          echo "All tests and container builds succeeded!"
          echo "Triggering deployment webhook or cloud deployment..."
        # If deploying to Render via deploy hook:
        # env:
        #   RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        # run: |
        #   if [ -n "$RENDER_DEPLOY_HOOK" ]; then
        #     curl -X POST "$RENDER_DEPLOY_HOOK"
        #   fi
